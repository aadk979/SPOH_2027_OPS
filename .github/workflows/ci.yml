name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests (in-memory Postgres, no services needed)
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrations are up to date with the schema
        run: |
          cd server
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "Schema changed without a migration. Run: npm run db:generate"; git status drizzle; exit 1
          fi
